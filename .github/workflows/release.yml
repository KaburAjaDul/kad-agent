name: Release container

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kaburajadul/kad-agent
  IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}

jobs:
  release:
    if: >-
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact CI commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.workflow_run.repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the immutable amd64 image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          sbom: false

      - name: Verify pushed runtime image before attestation
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE_REF"
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Config.User}}')" = "kad-agent"
          docker image inspect "$IMAGE_REF" --format '{{json .Config.Healthcheck.Test}}' | grep -F '/readyz'
          docker run --rm --platform linux/amd64 --init \
            --env BOT_DRY_RUN=true \
            --tmpfs /data:uid=10001,gid=10001 \
            "$IMAGE_REF" --dry-run

      - name: Write the machine-readable image digest
        id: digest
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          case "$IMAGE_DIGEST" in sha256:*) ;; *) echo "build did not return a sha256 digest" >&2; exit 1 ;; esac
          image_ref="$IMAGE_NAME@$IMAGE_DIGEST"
          jq -n \
            --arg image "$IMAGE_NAME" \
            --arg tag "$IMAGE_TAG" \
            --arg digest "$IMAGE_DIGEST" \
            --arg imageRef "$image_ref" \
            --arg sourceSha "$SOURCE_SHA" \
            '{image: $image, tag: $tag, digest: $digest, imageRef: $imageRef, sourceSha: $sourceSha, platform: "linux/amd64"}' \
            > image-digest.json
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          {
            echo "## Container release"
            echo
            echo '```json'
            cat image-digest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Scan the pushed image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digest.outputs.image_ref }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Generate an SPDX SBOM for the pushed image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.digest.outputs.image_ref }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the SBOM to the image digest
        uses: actions/attest-sbom@10926c72720ffc3f7b666661c8e55b1344e2a365 # v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest the build provenance to the image digest
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kad-agent-image-${{ github.event.workflow_run.head_sha }}
          path: |
            image-digest.json
            sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
